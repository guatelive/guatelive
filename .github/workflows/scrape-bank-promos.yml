name: Scrape bank promotions

on:
  schedule:
    # 12:00 UTC = 6:00 AM hora de Guatemala (UTC-6, sin horario de verano)
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Los secrets NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY están
    # configurados como "Environment secrets" bajo el ambiente "Production"
    # (no como Repository secrets) — sin declarar el ambiente acá, el job no
    # tiene acceso a ellos y llegan vacíos (createClient('', '') falla casi
    # instantáneo). Confirmado con 2 corridas fallidas del cron (~1s cada
    # una, antes y después de mergear los cambios del scraper de esta
    # sesión — mismo fallo en ambas, no relacionado al código del scraper).
    environment: Production
    strategy:
      # fail-fast: false — un banco caído no debe abortar el scrape de los
      # otros. Cada corrida es independiente: el propio scraper ya no toca la
      # tabla si su scrape individual falla (scrape-bank-promos.ts).
      #
      # Promerica sacado del matrix (2026-08-14, ver ADR-019 en
      # docs/decisions.md): clubpromerica.com se reestructuró (la URL vieja
      # que usaba el scraper ahora es 404) y de paso agregó un robots.txt
      # gestionado por Cloudflare que bloquea explícitamente ClaudeBot,
      # GPTBot, CCBot y otros crawlers de IA/scraping — confirmado también
      # con 403 directo contra la URL nueva. No es un bloqueo transitorio
      # para reintentar: es una señal explícita del sitio, mismo criterio ya
      # aplicado a eventos.guatemala.com (ADR-020/021). El adaptador
      # (bank-sources/promerica.ts) se deja en el repo por si el bloqueo se
      # revierte algún día, pero no corre en este cron.
      fail-fast: false
      matrix:
        bank: [bac, gtc]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsx scripts/scrape-bank-promos.ts --bank=${{ matrix.bank }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
